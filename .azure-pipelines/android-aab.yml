trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  ANDROID_SDK_ROOT: '$(HOME)/android-sdk'
  GRADLE_USER_HOME: '$(HOME)/.gradle'

steps:
  - checkout: self
    fetchDepth: 1

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: "JDK"

  - task: Cache@2
    inputs:
      key: 'gradle | "$(Agent.OS)" | **/gradle-wrapper.properties'
      restoreKeys: |
        gradle | "$(Agent.OS)"
      path: '$(GRADLE_USER_HOME)'
    displayName: "Cache"

  - bash: |
      set -e
      mkdir -p "$ANDROID_SDK_ROOT"
      echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      yes | sdkmanager --licenses || true
      sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
    displayName: "Install SDK"

  - task: DownloadSecureFile@1
    name: getKeystore
    inputs:
      secureFile: 'upload-keystore.jks'
    displayName: "Fetch keystore"

  - bash: |
      mkdir -p "$HOME/keystore"
      cp "$(getKeystore.secureFilePath)" "$HOME/keystore/upload-keystore.jks"
    displayName: "Copy keystore"

  - bash: |
      chmod +x ./gradlew
      ./gradlew clean :app:bundleRelease --no-daemon --stacktrace
    env:
      KEY_ALIAS: $(KEY_ALIAS)
      KEYSTORE_PASSWORD: $(KEYSTORE_PASSWORD)
      KEY_PASSWORD: $(KEY_PASSWORD)
      PRICES_CRAWLER_SERVER_URL_RELEASE: $(PRICES_CRAWLER_SERVER_URL_RELEASE)
      PRICES_CRAWLER_SERVER_URL_DEBUG: $(PRICES_CRAWLER_SERVER_URL_DEBUG)
    displayName: "Build AAB"

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'app/build/outputs/bundle/release'
      ArtifactName: 'aab'
      publishLocation: 'Container'
    displayName: "Publish AAB"
